name: Fix Mojmap Modifier Errors

on:
  push:
    branches:
      - unkobriri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Mojmap source files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path("src/main/java/com/sakalti/modifier")

          targets = [
              root / "CoralianModifier.java",
              root / "IceBindModifier.java",
              root / "SuperMagnetModifier.java",
              root / "LongsparkModifier.java",
              root / "LureMeteorModifier.java",
              root / "FireWallModifier.java",
              root / "LaserPrismModifier.java",
          ]

          for path in targets:
              if not path.is_file():
                  raise SystemExit(f"Missing expected file: {path}")

          # ---------------------------------------------------------
          # CoralianModifier
          # ---------------------------------------------------------

          path = root / "CoralianModifier.java"
          text = path.read_text(encoding="utf-8")

          if "new MobEffectInstance(" in text:
              if "import net.minecraft.world.effect.MobEffectInstance;" not in text:
                  marker = "import net.minecraft.world.effect.MobEffects;"

                  if marker not in text:
                      raise SystemExit(
                          "CoralianModifier.java: MobEffects import not found."
                      )

                  text = text.replace(
                      marker,
                      "import net.minecraft.world.effect.MobEffectInstance;\n"
                      + marker,
                      1
                  )

          path.write_text(text, encoding="utf-8")

          # ---------------------------------------------------------
          # damageSources()
          # Mojang mappings 1.20.1
          # ---------------------------------------------------------

          for path in targets:
              text = path.read_text(encoding="utf-8")

              text = text.replace(
                  ".getDamageSources()",
                  ".damageSources()"
              )

              path.write_text(text, encoding="utf-8")

          # ---------------------------------------------------------
          # SuperMagnetModifier
          # ---------------------------------------------------------

          path = root / "SuperMagnetModifier.java"
          text = path.read_text(encoding="utf-8")

          # Correct Mojmap form:
          #
          # x -> !x.hasPickUpDelay()
          #
          # Do not remove the lambda parameter.
          text = text.replace(
              "x->x.getPickupDelay() <= 0",
              "x->!x.hasPickUpDelay()"
          )

          text = text.replace(
              "x -> x.getPickupDelay() <= 0",
              "x -> !x.hasPickUpDelay()"
          )

          # Repair the broken form produced by the previous workflow.
          text = text.replace(
              "getEntitiesOfClass(ItemEntity.class,e.getBoundingBox().inflate(6),!x.hasPickUpDelay())",
              "getEntitiesOfClass(ItemEntity.class,e.getBoundingBox().inflate(6),x->!x.hasPickUpDelay())"
          )

          text = text.replace(
              "getEntitiesOfClass(ItemEntity.class, e.getBoundingBox().inflate(6), !x.hasPickUpDelay())",
              "getEntitiesOfClass(ItemEntity.class, e.getBoundingBox().inflate(6), x -> !x.hasPickUpDelay())"
          )

          path.write_text(text, encoding="utf-8")

          # ---------------------------------------------------------
          # Safety verification
          # No compilation is performed by this workflow.
          # ---------------------------------------------------------

          for path in targets:
              text = path.read_text(encoding="utf-8")

              if ".getDamageSources()" in text:
                  raise SystemExit(
                      f"Old getDamageSources() remains: {path}"
                  )

              if "getPickupDelay()" in text:
                  raise SystemExit(
                      f"Old getPickupDelay() remains: {path}"
                  )

          super_magnet = (
              root / "SuperMagnetModifier.java"
          ).read_text(encoding="utf-8")

          if "!x.hasPickUpDelay()" not in super_magnet:
              raise SystemExit(
                  "SuperMagnetModifier.java: expected "
                  "'!x.hasPickUpDelay()' was not found."
              )

          if ",!x.hasPickUpDelay())" in super_magnet:
              raise SystemExit(
                  "SuperMagnetModifier.java: broken lambda remains."
              )

          if ", !x.hasPickUpDelay())" in super_magnet:
              raise SystemExit(
                  "SuperMagnetModifier.java: broken lambda remains."
              )

          coralian = (
              root / "CoralianModifier.java"
          ).read_text(encoding="utf-8")

          if "new MobEffectInstance(" in coralian:
              if "import net.minecraft.world.effect.MobEffectInstance;" not in coralian:
                  raise SystemExit(
                      "CoralianModifier.java: MobEffectInstance import missing."
                  )

          print("Source repair completed.")
          print("No Gradle compilation is performed.")

          PY

      - name: Show changes
        shell: bash
        run: |
          set -euo pipefail

          git diff -- \
            src/main/java/com/sakalti/modifier/CoralianModifier.java \
            src/main/java/com/sakalti/modifier/IceBindModifier.java \
            src/main/java/com/sakalti/modifier/SuperMagnetModifier.java \
            src/main/java/com/sakalti/modifier/LongsparkModifier.java \
            src/main/java/com/sakalti/modifier/LureMeteorModifier.java \
            src/main/java/com/sakalti/modifier/FireWallModifier.java \
            src/main/java/com/sakalti/modifier/LaserPrismModifier.java

      - name: Verify changed files
        shell: bash
        run: |
          set -euo pipefail

          allowed_files=(
            "src/main/java/com/sakalti/modifier/CoralianModifier.java"
            "src/main/java/com/sakalti/modifier/IceBindModifier.java"
            "src/main/java/com/sakalti/modifier/SuperMagnetModifier.java"
            "src/main/java/com/sakalti/modifier/LongsparkModifier.java"
            "src/main/java/com/sakalti/modifier/LureMeteorModifier.java"
            "src/main/java/com/sakalti/modifier/FireWallModifier.java"
            "src/main/java/com/sakalti/modifier/LaserPrismModifier.java"
          )

          git diff --name-only | while IFS= read -r file; do
            found=false

            for allowed in "${allowed_files[@]}"; do
              if [[ "$file" == "$allowed" ]]; then
                found=true
                break
              fi
            done

            if [[ "$found" != true ]]; then
              echo "Unexpected modified file: $file"
              exit 1
            fi
          done

      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/main/java/com/sakalti/modifier/CoralianModifier.java \
            src/main/java/com/sakalti/modifier/IceBindModifier.java \
            src/main/java/com/sakalti/modifier/SuperMagnetModifier.java \
            src/main/java/com/sakalti/modifier/LongsparkModifier.java \
            src/main/java/com/sakalti/modifier/LureMeteorModifier.java \
            src/main/java/com/sakalti/modifier/FireWallModifier.java \
            src/main/java/com/sakalti/modifier/LaserPrismModifier.java

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix Mojmap modifier source mappings"

      - name: Push to unkobriri
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:unkobriri
