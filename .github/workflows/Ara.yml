name: Commit

on:
  workflow_dispatch:
  push:
    branches: 
      - unkobriri

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          shopt -s dotglob nullglob
          items=(extracted/*)

          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -a "${items[0]}"/. ./
          else
            cp -a extracted/. ./
          fi

          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import Sakalti Hephaestus 1.20.1 project"
          git pull
          git push
