name: Commit

on:
  workflow_dispatch:
  push:
    branches:
      - unkobriri

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found."
            exit 1
          fi

          echo "ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -oq "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -type f -print

          # ZIPの中にプロジェクトフォルダが1つだけある場合、その中身をルートへ展開
          shopt -s dotglob nullglob
          items=(extracted/*)

          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -a "${items[0]}"/. ./
          else
            cp -a extracted/. ./
          fi

          rm -rf extracted
          rm -f "$ZIP"

          echo "Workspace after extraction:"
          find . -maxdepth 3 -type f -print

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ワークスペース内の変更を全部ステージ
          git add -A

          # ZIPやActions自身の変更をコミット対象から除外
          git reset -- '*.zip' 2>/dev/null || true
          git reset -- '.github/workflows/*' 2>/dev/null || true

          echo "=== Staged files ==="
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import Sakalti Hephaestus 1.20.1 project"

          git push origin HEAD:unkobriri
