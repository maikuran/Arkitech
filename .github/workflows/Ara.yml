name: Commit

on:
  workflow_dispatch:
  push:
    branches:
      - unkobriri

permissions:
  contents: write
  workflows: write

jobs:
  commit:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="Sakalti-Hephaestus-1.20.1-all-recipes-build.zip"

          test -f "$ZIP_FILE"

          rm -rf .extract
          mkdir -p .extract

          unzip -o "$ZIP_FILE" -d .extract

          rm -rf .extract/.git

          cp -a .extract/. .
          rm -rf .extract

      - name: Commit
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Sakalti Hephaestus 1.20.1"
          git push origin HEAD:unkobriri
