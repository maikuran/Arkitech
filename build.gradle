plugins {
    id 'fabric-loom' version '1.6.11'
}

version = '1.0.1-hephaestus'
group = 'com.sakalti'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    mavenCentral()
}

def hephaestusJar = file('libs/Hephaestus-1.20.1-3.6.4.305.jar')

if (!hephaestusJar.exists()) {
    throw new GradleException("Missing ${hephaestusJar}; the Hephaestus jar must be present in libs/")
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
    modImplementation files(hephaestusJar)
    modImplementation 'dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.2'
    modImplementation 'dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 17 }

java { withSourcesJar() }

loom { splitEnvironmentSourceSets() }
