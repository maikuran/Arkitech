plugins {
    id 'fabric-loom' version '1.7.2'
}

version = '1.0.1-hephaestus'
group = 'com.sakalti'

def minecraftVersion = '1.20.1'
def fabricLoaderVersion = '0.17.2'
def fabricApiVersion = '0.92.6+1.20.1'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings "net.fabricmc:yarn:${minecraftVersion}+build.10:v2"

    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    modImplementation "curse.maven:hephaestus-fabric-667894:7223152"

    modImplementation 'dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.2'
    modImplementation 'dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.2'
}

/*
 * Hephaestusに内蔵されているMantleを抽出する
 */
def mantleExtractDir = layout.buildDirectory.dir("embedded-mantle")

tasks.register("extractEmbeddedMantle") {
    outputs.dir(mantleExtractDir)

    doLast {
        def hephaestusArtifact = configurations.modImplementation.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.name.toLowerCase().contains("hephaestus")
        }

        if (hephaestusArtifact == null) {
            throw new GradleException(
                "Hephaestus JAR could not be found."
            )
        }

        def hephaestusJar = hephaestusArtifact.file

        def mantleEntry = new java.util.zip.ZipFile(hephaestusJar).entries().find {
            it.name ==~ /META-INF\/jars\/Mantle-.*\.jar/
        }

        if (mantleEntry == null) {
            throw new GradleException(
                "Embedded Mantle JAR was not found inside ${hephaestusJar.name}"
            )
        }

        def outputDir = mantleExtractDir.get().asFile
        outputDir.mkdirs()

        def mantleFile = new File(outputDir, "Mantle-1.20.1-1.9.291.jar")

        def zip = new java.util.zip.ZipFile(hephaestusJar)

        try {
            def entry = zip.getEntry(mantleEntry.name)

            zip.getInputStream(entry).withCloseable { input ->
                mantleFile.withOutputStream { output ->
                    output << input
                }
            }
        } finally {
            zip.close()
        }

        println "Embedded Mantle extracted:"
        println "  ${mantleFile}"
    }
}

/*
 * 抽出したMantleをコンパイル時classpathに追加
 *
 * 実行時にはHephaestus内蔵Mantleを使用するため、
 * compileOnlyにして二重同梱を防ぐ。
 */
def embeddedMantleJar = mantleExtractDir.map {
    new File(it.asFile, "Mantle-1.20.1-1.9.291.jar")
}

dependencies {
    compileOnly files(embeddedMantleJar)
}

tasks.named("compileJava") {
    dependsOn(tasks.named("extractEmbeddedMantle"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()
}
