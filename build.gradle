plugins {
    id 'fabric-loom' version '1.9.2'
}

version = '1.0.1-hephaestus'
group = 'com.sakalti'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

def hephaestusDependency = 'curse.maven:hephaestus-fabric-667894:7223152'
def nestedMantleJar = layout.buildDirectory.file('embedded-libs/Mantle-1.20.1-1.9.291.jar')

def hephaestusBundle = configurations.detachedConfiguration(dependencies.create(hephaestusDependency))

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()

    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
    modImplementation hephaestusDependency
    compileOnly files(nestedMantleJar)

    modImplementation 'dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.2'
    modImplementation 'dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.2'
}

tasks.register('extractEmbeddedMantle') {
    inputs.files(hephaestusBundle)
    outputs.file(nestedMantleJar)

    doLast {
        def jarFile = hephaestusBundle.singleFile
        if (jarFile == null || !jarFile.exists()) {
            throw new GradleException("Hephaestus dependency was not resolved: ${hephaestusDependency}")
        }

        def outputFile = nestedMantleJar.get().asFile
        outputFile.parentFile.mkdirs()

        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = zip.entries().find { it.name.startsWith('META-INF/jars/Mantle-') && it.name.endsWith('.jar') }
            if (entry == null) {
                throw new GradleException('Hephaestus jar does not contain a Mantle jar under META-INF/jars/')
            }

            outputFile.withOutputStream { out ->
                zip.getInputStream(entry).transferTo(out)
            }
        } finally {
            zip.close()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('extractEmbeddedMantle')
    classpath += files(nestedMantleJar)
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java { withSourcesJar() }

loom { splitEnvironmentSourceSets() }
